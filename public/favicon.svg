<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Crystal ball base/stand -->
  <ellipse cx="32" cy="56" rx="14" ry="4" fill="#4c1d95"/>
  <rect x="26" y="52" width="12" height="5" rx="2" fill="#5b21b6"/>
  
  <!-- Crystal ball sphere -->
  <circle cx="32" cy="30" r="22" fill="url(#ballGradient)" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- Inner glow -->
  <circle cx="32" cy="30" r="18" fill="url(#innerGlow)" opacity="0.6"/>
  
  <!-- Sparkle/star inside the ball -->
  <path d="M32 18 L33.5 25.5 L40 24 L34.5 28.5 L38 35 L32 30.5 L26 35 L29.5 28.5 L24 24 L30.5 25.5 Z" fill="url(#sparkleGradient)" opacity="0.9"/>
  
  <!-- Small stars -->
  <circle cx="26" cy="22" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="38" cy="35" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="28" cy="36" r="0.8" fill="#c4b5fd" opacity="0.7"/>
  
  <!-- Light reflection on glass -->
  <ellipse cx="25" cy="22" rx="5" ry="8" fill="white" opacity="0.15" transform="rotate(-20 25 22)"/>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="ballGradient" x1="10" y1="8" x2="54" y2="52">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f0a2e"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="10" y1="8" x2="54" y2="52">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="32" cy="30" r="18">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f0a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkleGradient" x1="26" y1="18" x2="38" y2="35">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
</svg>
